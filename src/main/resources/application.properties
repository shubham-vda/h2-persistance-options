# H2 file-based database - data survives restarts as long as DB_DATA_DIR points
# at storage that outlives the container (an EFS mount in ECS; a plain local
# folder when running on a laptop, which is the default below).
spring.datasource.url=jdbc:h2:file:${DB_DATA_DIR:./data}/h2-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep existing data on restart; only add missing tables/columns.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional web-based DB browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Health endpoint for the ECS task definition's container health check.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

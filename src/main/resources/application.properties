# H2 file-based database - data survives application restarts.
spring.datasource.url=jdbc:h2:file:./data/h2-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep existing data on restart; only add missing tables/columns.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional web-based DB browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# --- Optional: back up / restore the H2 database via S3 ---
# Leave app.persistence.s3.bucket blank to keep persistence purely local (default).
# Fill it in (and make sure AWS credentials are available via env vars, ~/.aws/credentials,
# or an IAM role) to have the database backed up to S3 and restored from S3 on startup.
app.persistence.s3.bucket=
app.persistence.s3.key=h2-backup/h2-db-backup.zip
app.persistence.s3.region=us-east-1
# How often (minutes) to push a fresh backup to S3 while the app is running.
app.persistence.s3.backup-interval-minutes=5
app.persistence.s3.local-backup-file=./data/h2-db-backup.zip
app.persistence.data-dir=./data
